[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q-transit-nexus"
version = "1.0.0"
description = "Q-TRANSIT NEXUS: Complete Quantum-Inspired Traffic & Routing Optimization System"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests", "SUMO/tests"]
python_files = ["test_*.py"]
pythonpath = [".", "SUMO"]
addopts = "-v"
